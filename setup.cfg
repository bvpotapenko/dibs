# Lint config (ARCHITECTURE §7, §10).
#
# flake8 runs ONLY wemake-python-styleguide checks (the WPS 1.x split);
# ruff (pyproject.toml) covers the classic bundle: E/W/F/I/N/D/S/UP/B.
# Fix-preference for any violation that fires: delete code -> simplify
# inline -> move to the owning module -- NEVER a new layer. A rule that
# survives all three gets a targeted, justified suppression and a flag
# to the maintainer (ARCHITECTURE §10).

[flake8]
max-line-length = 80
select = WPS
show-source = true
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist
# Project deviations from the wemake baseline (ARCHITECTURE §10):
# - dibs/__init__.py WPS412: ARCHITECTURE §3 pins DIBS_VERSION in this
#   file, and a zipapp carries no dist-info to read a version from;
#   WPS 1.x counts any assignment as "logic". Sanctioned + flagged.
# - tests: asserts and docstring rules live in ruff (S101/D kept for
#   doc parity); WPS202 fires on member count, which for a flat case
#   list (one test module per production module, ARCHITECTURE §11) is
#   just the case count; WPS204/WPS226 repetition and WPS210/WPS432
#   locals/literals are test idiom. Ruff also ignores S311 there:
#   the property tier's generators are seeded stdlib PRNGs chosen for
#   determinism (ARCHITECTURE §11), never for cryptography. Sanctioned
#   + flagged: §10's snippet needs a one-line amendment for it.
# - WPS442 (outer-scope shadowing) may fire on conftest fixture params
#   once implemented tests land; if flake8 confirms, extend the tests
#   line narrowly and flag it -- do not restructure fixtures around it.
per-file-ignores =
    dibs/__init__.py: WPS412
    tests/*.py: S101, D, WPS202, WPS204, WPS210, WPS226, WPS432

[isort]
# Mirrored by [tool.ruff.lint.isort]; kept for direct `isort` runs.
include_trailing_comma = true
use_parentheses = true
multi_line_output = 3
line_length = 80
known_first_party = dibs
